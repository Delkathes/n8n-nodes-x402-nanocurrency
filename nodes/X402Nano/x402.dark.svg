<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Active edge: horizontal cross-account tx (cyan → violet) -->
  <linearGradient id="flowH" x1="396" y1="540" x2="684" y2="540" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#06b6d4"/>
    <stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <!-- Active edge: receiver confirmation (violet → green) -->
  <linearGradient id="flowV" x1="684" y1="540" x2="828" y2="864" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <!-- Glow filter for active nodes -->
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="36" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>


<!-- ─── LATTICE EDGES (dim hint) ─── -->
<g stroke="#4a90c4" stroke-width="18" opacity="0.9">
  <!-- Row 1 horizontal -->
  <line x1="252" y1="216" x2="540" y2="216"/>
  <line x1="540" y1="216" x2="828" y2="216"/>
  <!-- Row 2 horizontal -->
  <line x1="108" y1="540" x2="396" y2="540"/>
  <line x1="684" y1="540" x2="972" y2="540"/>
  <!-- Row 3 horizontal -->
  <line x1="252" y1="864" x2="540" y2="864"/>
  <line x1="540" y1="864" x2="828" y2="864"/>
  <!-- Diagonals: row 1 → row 2 -->
  <line x1="252" y1="216" x2="108" y2="540"/>
  <line x1="540" y1="216" x2="684" y2="540"/>
  <line x1="828" y1="216" x2="684" y2="540"/>
  <line x1="828" y1="216" x2="972" y2="540"/>
  <!-- Diagonals: row 2 → row 3 -->
  <line x1="108" y1="540" x2="252" y2="864"/>
  <line x1="396" y1="540" x2="540" y2="864"/>
  <line x1="684" y1="540" x2="540" y2="864"/>
  <line x1="972" y1="540" x2="828" y2="864"/>
</g>

<!-- ─── ACTIVE TRANSACTION PATH ─── -->
<!-- 1. Sender chain block:  A(252,216) → E(396,540) — cyan -->
<line x1="252" y1="216" x2="396" y2="540" stroke="#06b6d4" stroke-width="60" stroke-linecap="round"/>
<!-- 2. Cross-account transfer: E(396,540) → F(684,540) — cyan→violet -->
<line x1="396" y1="540" x2="684" y2="540" stroke="url(#flowH)" stroke-width="60" stroke-linecap="round"/>
<!-- 3. Receiver chain block:  F(684,540) → J(828,864) — violet→green -->
<line x1="684" y1="540" x2="828" y2="864" stroke="url(#flowV)" stroke-width="60" stroke-linecap="round"/>

<!-- ─── DIM NODES ─── -->
<g fill="#1a3d5c" stroke="#4a90c4" stroke-width="14">
  <circle cx="540" cy="216" r="36"/>
  <circle cx="828" cy="216" r="36"/>
  <circle cx="108" cy="540" r="36"/>
  <circle cx="972" cy="540" r="36"/>
  <circle cx="252" cy="864" r="36"/>
  <circle cx="540" cy="864" r="36"/>
</g>

<!-- ─── ACTIVE NODES (glowing) ─── -->
<!-- A(252,216) — Sender block — CYAN -->
<circle cx="252" cy="216" r="52" fill="#06b6d4" filter="url(#glow)"/>
<circle cx="252" cy="216" r="22" fill="#cffafe"/>
<!-- E(396,540) — Send open block — CYAN lighter -->
<circle cx="396" cy="540" r="46" fill="#22d3ee" filter="url(#glow)"/>
<circle cx="396" cy="540" r="18" fill="#cffafe"/>
<!-- F(684,540) — Settlement / facilitator — VIOLET (largest) -->
<circle cx="684" cy="540" r="70" fill="#8b5cf6" filter="url(#glow)"/>
<circle cx="684" cy="540" r="28" fill="#ede9fe"/>
<!-- J(828,864) — Confirmed receive block — GREEN -->
<circle cx="828" cy="864" r="52" fill="#10b981" filter="url(#glow)"/>
<circle cx="828" cy="864" r="22" fill="#d1fae5"/>
</svg>
